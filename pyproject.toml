[project]
name = "it-faculty-curriculum"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.46,<2",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "openpyxl>=3.1,<4",
    "langdetect>=1.0.9,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.vercel]
entrypoint = "render_chat_app:app"
